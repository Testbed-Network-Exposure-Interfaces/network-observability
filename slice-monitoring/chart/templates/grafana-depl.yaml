{{- $grafana := dict "ctx" . "component" "grafana" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "slice-monitoring.componentName" $grafana }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "slice-monitoring.labels" $grafana | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "slice-monitoring.selectorLabels" $grafana | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "slice-monitoring.selectorLabels" $grafana | nindent 8 }}
      annotations:
        checksum/dashboards: {{ include (print $.Template.BasePath "/grafana-dashboards-cm.yaml") . | sha256sum }}
    spec:
      containers:
        - name: grafana
          image: "{{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}"
          imagePullPolicy: {{ .Values.grafana.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.grafana.port }}
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
      volumes:
        - name: datasources
          configMap:
            name: {{ .Values.grafana.datasourcesConfigMap }}
        - name: dashboards-provider
          configMap:
            name: {{ include "slice-monitoring.componentName" $grafana }}-dashboards
            items:
              - key: provider.yaml
                path: provider.yaml
        - name: dashboards
          {{- $dashboards := .Files.Glob "dashboards/*.json" }}
          {{- if $dashboards }}
          configMap:
            name: {{ include "slice-monitoring.componentName" $grafana }}-dashboards
            items:
              {{- range $path, $_ := $dashboards }}
              - key: {{ base $path }}
                path: {{ base $path }}
              {{- end }}
          {{- else }}
          emptyDir: {}
          {{- end }}
