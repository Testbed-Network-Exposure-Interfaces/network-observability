# Prometheus
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-external
  namespace: slice-monitoring
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: http
      nodePort: 30090
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: slice-monitoring
  labels:
    app: prometheus
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: slice-monitoring
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 1s
      scrape_timeout: 900ms   # lower than scrape_interval

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
    
      - job_name: 'throughput-exporter-5g-atnog'
        static_configs:
          - targets: ['10.255.27.60:9200']
    
      - job_name: 'throughput-exporter-5g-bbu'
        static_configs:
          - targets: [ '10.255.27.60:9201' ]
    
      # per-slice probers deployed by the slice-monitoring chart (RBAC in prometheus-rbac.yml)
      - job_name: 'slice-probers'
        scrape_interval: 5s
        scrape_timeout: 4s
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [ 'slice-monitoring' ]
        relabel_configs:
          - source_labels: [ __meta_kubernetes_pod_label_app_kubernetes_io_component, __meta_kubernetes_pod_container_port_name ]
            regex: prober;metrics
            action: keep
          - source_labels: [ __meta_kubernetes_pod_phase ]
            regex: Running
            action: keep
          - source_labels: [ __meta_kubernetes_pod_name ]
            target_label: pod

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  namespace: slice-monitoring
spec:
  serviceName: prometheus
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.1
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.enable-lifecycle"
            - "--web.enable-admin-api"
            - "--storage.tsdb.retention.time=90d"
            - "--storage.tsdb.retention.size=18GB"
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
