version: '3.8'

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data: {}

services:

  throughput-exporter-5g-atnog:
    build: ./throughput-exporter
    container_name: throughput-exporter-5g-atnog
    restart: unless-stopped
    network_mode: host
    command: ["--port", "9200", "--iface", "tap-5g-atnog"]

  throughput-exporter-5g-bbu:
    build: ./throughput-exporter
    container_name: throughput-exporter-5g-bbu
    restart: unless-stopped
    network_mode: host
    command: [ "--port", "9201", "--iface", "tap-5g-bbu" ]
